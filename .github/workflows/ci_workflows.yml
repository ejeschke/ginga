name: CI

on:
  push:
    branches:
    - main
    - 'v*'
    tags:
    - '*'
  pull_request:
  schedule:
    # Weekly Monday 6AM build
    # * is a special character in YAML so you have to quote this string
    - cron: '0 6 * * 1'

# Cancel duplicate builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@1285b95e32c783cfa40eb2ffbd6ca4cd023fb884  # v3.2.2
    with:
      submodules: false
      coverage: ''
      fail-fast: true
      envs: |
        # Make sure that packaging will work
        - name: Lint with flake8
          python-version: '3.x'
          linux: codestyle
        - name: PEP 517 build
          python-version: '3.x'
          linux: twine
        - name: Security audit
          python-version: '3.x'
          linux: bandit

        # Basic tests
        - name: Test with Python 3.12 on Windows
          windows: py312-test
          posargs: -sv
        - name: Test with Python 3.13 on OSX
          macos: py313-test
          posargs: -sv
        - name: Test with Python 3.14 on Linux
          linux: py314-test
          posargs: -sv

        - name: Test with old dependencies
          linux: py311-test-oldestdeps
          posargs: -sv

        - name: Test with dev dependencies
          linux: py315-test-devdeps
          posargs: -sv

        - name: Test with conda
          linux: py314-test-conda
          posargs: -sv
