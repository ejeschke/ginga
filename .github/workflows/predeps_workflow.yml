name: rc-testing

on:
  workflow_dispatch:

# Cancel duplicate builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@1285b95e32c783cfa40eb2ffbd6ca4cd023fb884  # v3.2.2
    with:
      submodules: false
      coverage: ''
      fail-fast: true
      envs: |
        # Basic tests but with RC
        - name: Test with Python 3.11 on Linux
          linux: py311-test-predeps
          posargs: -sv
        - name: Test with Python 3.15 on OSX
          macos: py315-test-predeps
          posargs: -sv
        - name: Test with Python 3.13 on Windows
          windows: py313-test-predeps
          posargs: -sv
